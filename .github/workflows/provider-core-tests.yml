name: Provider Core Tests

permissions:
  contents: write

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:

jobs:
  provider-core:
    runs-on: ubuntu-latest
    container: swift:6.2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Test LLM provider core
        run: bash scripts/test_provider_core.sh

      - name: Test Z.AI provider contract
        run: bash scripts/test_zai_provider.sh

      - name: Test Responses reasoning policy
        run: bash scripts/test_responses_policy.sh

      - name: Test STT provider core when present
        shell: bash
        run: |
          if [ -f scripts/test_stt_provider_core.sh ]; then
            bash scripts/test_stt_provider_core.sh
          else
            echo 'STT provider core test not present on this branch'
          fi

      - name: Test provider fallback core
        run: bash scripts/test_provider_fallback_core.sh

      - name: Test provider fallback integration
        run: bash scripts/test_provider_fallback_integration.sh

      - name: Test Thai-English mixed mode core
        run: bash scripts/test_thai_english_mixed_core.sh

      - name: Test Thai-English mixed mode integration
        run: bash scripts/test_thai_english_mixed_integration.sh

      - name: Test voice command core
        run: bash scripts/test_voice_command_core.sh

      - name: Test voice command integration
        run: bash scripts/test_voice_command_integration.sh

      - name: Test voice snippet core
        run: bash scripts/test_voice_snippet_core.sh

      - name: Test voice snippet store
        run: bash scripts/test_voice_snippet_store.sh

      - name: Test voice snippet integration
        run: bash scripts/test_voice_snippet_integration.sh

      - name: Test voice snippet UI
        run: bash scripts/test_voice_snippet_ui.sh

      - name: Test local Whisper core
        run: bash scripts/test_local_whisper_core.sh

      - name: Test local Whisper settings
        run: bash scripts/test_local_whisper_settings.sh

      - name: Test local Whisper integration
        run: bash scripts/test_local_whisper_integration.sh

      - name: Test local Whisper UI
        run: bash scripts/test_local_whisper_ui.sh

      - name: Test AI action core
        run: bash scripts/test_ai_action_core.sh

      - name: Test AI action integration
        run: bash scripts/test_ai_action_integration.sh

      - name: Test AI action UI
        run: bash scripts/test_ai_action_ui.sh

      - name: Test Meeting core
        run: bash scripts/test_meeting_core.sh

      - name: Test Meeting store
        run: bash scripts/test_meeting_store.sh

      - name: Test Meeting integration
        run: bash scripts/test_meeting_integration.sh

      - name: Test Meeting UI
        run: bash scripts/test_meeting_ui.sh

      - name: Test secure credential contract
        run: bash scripts/test_secure_credentials_contract.sh

      - name: Test macOS arm64 release contract
        run: bash scripts/test_macos_arm64_release_config.sh

      - name: Test dictation pipeline core
        run: bash scripts/test_dictation_pipeline_core.sh

      - name: Test controller pipeline boundary
        run: bash scripts/test_dictation_controller_pipeline_contract.sh

      - name: Test Dictionary V2 core
        run: bash scripts/test_dictionary_v2_core.sh

      - name: Test Dictionary V2 UI boundary
        run: bash scripts/test_dictionary_v2_ui_contract.sh

      - name: Test History core
        run: bash scripts/test_history_core.sh

      - name: Test History UI and undo boundary
        run: bash scripts/test_history_ui_contract.sh

      - name: Test App-aware Profiles core
        run: bash scripts/test_app_profiles_core.sh

      - name: Test App-aware Profiles integration
        run: bash scripts/test_app_profiles_integration.sh

  macos-build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Build macOS app
        run: swift build -c release

      - name: Assemble ad-hoc signed test app
        shell: bash
        run: |
          set -euo pipefail
          chmod +x make_app.sh
          ./make_app.sh
          codesign --verify --deep --strict --verbose=2 Whisper.app
          test "$(lipo -archs Whisper.app/Contents/MacOS/WhisperApp)" = "arm64"

          ditto -c -k --sequesterRsrc --keepParent Whisper.app Whisper-main-macOS-arm64-test.zip
          shasum -a 256 Whisper-main-macOS-arm64-test.zip > Whisper-main-macOS-arm64-test.zip.sha256

          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Info.plist)
          DMG="Whisper-${VERSION}-macOS-arm64-test.dmg"
          STAGE="$(mktemp -d)"
          trap 'rm -rf "$STAGE"' EXIT
          cp -R Whisper.app "$STAGE/Whisper.app"
          ln -s /Applications "$STAGE/Applications"

          hdiutil create \
            -volname "Whisper" \
            -srcfolder "$STAGE" \
            -ov \
            -format UDZO \
            "$DMG"

          hdiutil verify "$DMG"
          shasum -a 256 "$DMG" > "$DMG.sha256"
          ls -lh "$DMG" "$DMG.sha256"

      - name: Upload macOS test installer
        uses: actions/upload-artifact@v4
        with:
          name: Whisper-main-macOS-arm64-test
          path: |
            Whisper-main-macOS-arm64-test.zip
            Whisper-main-macOS-arm64-test.zip.sha256
            Whisper-*-macOS-arm64-test.dmg
            Whisper-*-macOS-arm64-test.dmg.sha256
          if-no-files-found: error
          retention-days: 30

  windows-build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Windows app
        shell: cmd
        run: windows\build.bat

      - name: Test Windows security and parity
        shell: powershell
        run: windows\test_security_parity.ps1

      - name: Package Windows portable executable
        shell: powershell
        run: |
          Copy-Item windows\WhisperApp.exe Whisper-Windows-x64.exe
          $hash = (Get-FileHash Whisper-Windows-x64.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  Whisper-Windows-x64.exe" | Set-Content Whisper-Windows-x64.exe.sha256 -Encoding ascii

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: Whisper-Windows-x64
          path: |
            Whisper-Windows-x64.exe
            Whisper-Windows-x64.exe.sha256
          if-no-files-found: error
          retention-days: 30


  publish-test-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - provider-core
      - macos-build
      - windows-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download macOS installer
        uses: actions/download-artifact@v4
        with:
          name: Whisper-main-macOS-arm64-test
          path: dist/macos

      - name: Download Windows executable
        uses: actions/download-artifact@v4
        with:
          name: Whisper-Windows-x64
          path: dist/windows

      - name: Publish rolling prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="test-latest"

          git tag -f "$TAG" "$GITHUB_SHA"
          git push origin -f "refs/tags/$TAG"

          mapfile -t ASSETS < <(find dist -type f -maxdepth 2 | sort)
          printf 'Publishing assets:\n'
          printf ' - %s\n' "${ASSETS[@]}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
            gh release edit "$TAG" \
              --title "Whisper Test Build (Latest)" \
              --prerelease \
              --notes "Automated test release from main commit $GITHUB_SHA. macOS DMG is ad-hoc signed (not notarized); Windows asset is a portable executable."
          else
            gh release create "$TAG" "${ASSETS[@]}" \
              --target "$GITHUB_SHA" \
              --title "Whisper Test Build (Latest)" \
              --prerelease \
              --notes "Automated test release from main commit $GITHUB_SHA. macOS DMG is ad-hoc signed (not notarized); Windows asset is a portable executable."
          fi
